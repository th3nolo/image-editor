name: Verilog options A/B compile check

on:
  push:
    branches:
      - verification/verilog-options-a-b-20260904
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install HDL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys
          echo "=== TOOL VERSIONS ==="
          iverilog -V 2>&1 | head -n 3
          verilator --version
          yosys -V

      - name: Write the two exact submitted modules and testbenches
        shell: bash
        run: |
          mkdir -p /tmp/verilog-check/results
          cd /tmp/verilog-check

          cat > option_a.v <<'VERILOG_A'
          module classic_microprocessor_core (
              input  wire        clk,
              input  wire        rst_n,
              
              // External Bus Interface
              input  wire [7:0]  data_in,
              output reg  [7:0]  data_out,
              output reg  [15:0] addr_bus,
              output reg         mem_read,
              output reg         mem_write
          );

              // ------------------------------------------------------------------------
              // Internal Registers & State
              // ------------------------------------------------------------------------
              reg [7:0]  acc;         // Accumulator
              reg [7:0]  ir;          // Instruction Register
              reg [15:0] pc;          // Program Counter
              reg [1:0]  state;       // Execution Phase Controller

              localparam FETCH   = 2'b00,
                         DECODE  = 2'b01,
                         EXECUTE = 2'b10,
                         WRITE   = 2'b11;

              // Example Instruction Opcodes (Representing the PLA decoding matrix)
              localparam OP_NOP  = 8'h00,
                         OP_LDA  = 8'h01, // Load Accumulator from memory
                         OP_STA  = 8'h02, // Store Accumulator to memory
                         OP_ADD  = 8'h03; // Add memory content to Accumulator

              // ------------------------------------------------------------------------
              // State Sequencer & Control Path (Green Matrix / PLA equivalent)
              // ------------------------------------------------------------------------
              always @(posedge clk or negedge rst_n) begin
                  if (!rst_n) begin
                      state     <= FETCH;
                      pc        <= 16'h0000;
                      ir        <= OP_NOP;
                      acc       <= 8'h00;
                      data_out  <= 8'h00;
                      addr_bus  <= 16'h0000;
                      mem_read  <= 1'b0;
                      mem_write <= 1'b0;
                  end else begin
                      case (state)
                          FETCH: begin
                              addr_bus  <= pc;
                              mem_read  <= 1'b1;
                              mem_write <= 1'b0;
                              state     <= DECODE;
                          end

                          DECODE: begin
                              ir       <= data_in; // Latch opcode into IR
                              mem_read <= 1'b0;
                              pc       <= pc + 1'b1;
                              state    <= EXECUTE;
                          end

                          EXECUTE: begin
                              // --------------------------------------------------------
                              // Datapath & ALU Operations (Blue/Striped Columns)
                              // --------------------------------------------------------
                              case (ir)
                                  OP_NOP: begin
                                      state <= FETCH;
                                  end

                                  OP_LDA: begin
                                      // Fetch operand address or immediate byte
                                      addr_bus <= {8'h00, data_in}; 
                                      mem_read <= 1'b1;
                                      acc      <= data_in;
                                      state    <= FETCH;
                                  end

                                  OP_STA: begin
                                      data_out  <= acc;
                                      mem_write <= 1'b1;
                                      state     <= FETCH;
                                  end

                                  OP_ADD: begin
                                      acc   <= acc + data_in; // ALU Addition slice
                                      state <= FETCH;
                                  end

                                  default: begin
                                      state <= FETCH;
                                  end
                              endcase
                          end

                          default: state <= FETCH;
                      endcase
                  end
              end

          endmodule
          VERILOG_A

          cat > option_b.v <<'VERILOG_B'
          module classic_proc (
              input  wire        clk,
              input  wire        reset,
              input  wire [7:0]  data_in,
              output reg  [7:0]  data_out,
              output reg  [15:0] addr_bus,
              output reg         mem_write
          );

              // Architectural Registers (Datapath slice)
              reg [15:0] pc;
              reg [7:0]  acc;
              reg [7:0]  ir;
              
              // State machine states (Microcode / PLA control)
              localparam FETCH   = 2'b00,
                         DECODE  = 2'b01,
                         EXECUTE = 2'b10;

              reg [1:0] state;

              always @(posedge clk or posedge reset) begin
                  if (reset) begin
                      pc        <= 16'h0000;
                      acc       <= 8'h00;
                      ir        <= 8'h00;
                      state     <= FETCH;
                      mem_write <= 1'b0;
                      addr_bus  <= 16'h0000;
                      data_out  <= 8'h00;
                  end else begin
                      case (state)
                          FETCH: begin
                              addr_bus  <= pc;
                              mem_write <= 1'b0;
                              state     <= DECODE;
                          end

                          DECODE: begin
                              ir    <= data_in;
                              pc    <= pc + 1'b1;
                              state <= EXECUTE;
                          end

                          EXECUTE: begin
                              case (ir[7:4])
                                  4'h1: acc <= acc + data_in;         // ADD
                                  4'h2: acc <= acc - data_in;         // SUB
                                  4'h3: acc <= acc & data_in;         // AND
                                  4'h4: acc <= acc ^ data_in;         // XOR
                                  4'h5: begin                         // STA (Store)
                                      data_out  <= acc;
                                      mem_write <= 1'b1;
                                  end
                                  default: ;
                              endcase
                              state <= FETCH;
                          end
                      endcase
                  end
              end

          endmodule
          VERILOG_B

          cat > tb_option_a.sv <<'TB_A'
          `timescale 1ns/1ps
          module tb_option_a;
              reg clk = 1'b0;
              reg rst_n = 1'b0;
              wire [7:0] data_in;
              wire [7:0] data_out;
              wire [15:0] addr_bus;
              wire mem_read;
              wire mem_write;
              reg [7:0] memory [0:65535];
              integer i;

              assign data_in = memory[addr_bus];

              classic_microprocessor_core dut (
                  .clk(clk), .rst_n(rst_n), .data_in(data_in),
                  .data_out(data_out), .addr_bus(addr_bus),
                  .mem_read(mem_read), .mem_write(mem_write)
              );

              always #5 clk = ~clk;

              initial begin
                  for (i = 0; i < 65536; i = i + 1) memory[i] = 8'h00;
                  memory[16'h0000] = 8'h01; // OP_LDA
                  memory[16'h0001] = 8'hA5; // intended next-byte operand/data

                  repeat (2) @(posedge clk);
                  @(negedge clk);
                  rst_n = 1'b1;

                  repeat (3) @(posedge clk);
                  #1;
                  $display("A_OBSERVATION state=%0d pc=%04h ir=%02h addr=%04h data_in=%02h acc=%02h mem_read=%b mem_write=%b",
                           dut.state, dut.pc, dut.ir, addr_bus, data_in, dut.acc, mem_read, mem_write);
                  if (dut.acc === 8'hA5)
                      $display("A_MEMORY_CONTRACT=PASS");
                  else
                      $display("A_MEMORY_CONTRACT=FAIL expected_acc=A5 actual_acc=%02h", dut.acc);
                  $finish;
              end
          endmodule
          TB_A

          cat > tb_option_b.sv <<'TB_B'
          `timescale 1ns/1ps
          module tb_option_b;
              reg clk = 1'b0;
              reg reset = 1'b1;
              wire [7:0] data_in;
              wire [7:0] data_out;
              wire [15:0] addr_bus;
              wire mem_write;
              reg [7:0] memory [0:65535];
              integer i;

              assign data_in = memory[addr_bus];

              classic_proc dut (
                  .clk(clk), .reset(reset), .data_in(data_in),
                  .data_out(data_out), .addr_bus(addr_bus),
                  .mem_write(mem_write)
              );

              always #5 clk = ~clk;

              initial begin
                  for (i = 0; i < 65536; i = i + 1) memory[i] = 8'h00;
                  memory[16'h0000] = 8'h10; // ADD opcode class
                  memory[16'h0001] = 8'h05; // intended next-byte operand

                  repeat (2) @(posedge clk);
                  @(negedge clk);
                  reset = 1'b0;

                  repeat (3) @(posedge clk);
                  #1;
                  $display("B_OBSERVATION state=%0d pc=%04h ir=%02h addr=%04h data_in=%02h acc=%02h mem_write=%b",
                           dut.state, dut.pc, dut.ir, addr_bus, data_in, dut.acc, mem_write);
                  if (dut.acc === 8'h05)
                      $display("B_MEMORY_CONTRACT=PASS");
                  else
                      $display("B_MEMORY_CONTRACT=FAIL expected_acc=05 actual_acc=%02h", dut.acc);
                  $finish;
              end
          endmodule
          TB_B

          sha256sum option_a.v option_b.v | tee results/source-sha256.txt

      - name: Compile, lint, synthesize, and simulate
        shell: bash
        run: |
          set +e
          cd /tmp/verilog-check

          run_and_capture() {
            name="$1"
            shift
            echo
            echo "===== ${name} ====="
            "$@" >"results/${name}.log" 2>&1
            rc=$?
            cat "results/${name}.log"
            echo "${name}_EXIT=${rc}" | tee -a results/exit-codes.txt
            return 0
          }

          run_and_capture A_IVERILOG_COMPILE \
            iverilog -g2012 -Wall -s classic_microprocessor_core -o results/option_a.vvp option_a.v
          run_and_capture B_IVERILOG_COMPILE \
            iverilog -g2012 -Wall -s classic_proc -o results/option_b.vvp option_b.v

          run_and_capture A_VERILATOR_LINT \
            verilator --lint-only --timing -Wall --top-module classic_microprocessor_core option_a.v
          run_and_capture B_VERILATOR_LINT \
            verilator --lint-only --timing -Wall --top-module classic_proc option_b.v

          run_and_capture A_YOSYS_SYNTH \
            yosys -p "read_verilog option_a.v; hierarchy -check -top classic_microprocessor_core; proc; check; synth -top classic_microprocessor_core; stat"
          run_and_capture B_YOSYS_SYNTH \
            yosys -p "read_verilog option_b.v; hierarchy -check -top classic_proc; proc; check; synth -top classic_proc; stat"

          run_and_capture A_TESTBENCH_COMPILE \
            iverilog -g2012 -Wall -s tb_option_a -o results/tb_option_a.vvp option_a.v tb_option_a.sv
          run_and_capture A_TESTBENCH_RUN \
            vvp results/tb_option_a.vvp

          run_and_capture B_TESTBENCH_COMPILE \
            iverilog -g2012 -Wall -s tb_option_b -o results/tb_option_b.vvp option_b.v tb_option_b.sv
          run_and_capture B_TESTBENCH_RUN \
            vvp results/tb_option_b.vvp

          echo
          echo "===== EXIT CODE SUMMARY ====="
          cat results/exit-codes.txt

          cp option_a.v option_b.v tb_option_a.sv tb_option_b.sv results/
          exit 0

      - name: Upload complete verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verilog-options-a-b-verification
          path: /tmp/verilog-check/results
          if-no-files-found: warn
